<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Einkaufsliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a0e0c">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#f5f3ec;--surface:#fff;--ink:#1e2a23;--muted:#66726b;--line:#e3e0d6;
  --accent:#2f7d4f;--accent-ink:#fff;--accent-soft:#e2f1e7;--warn:#b4541a;--danger:#b3261e;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111512;--surface:#1a201c;--ink:#e7ece8;--muted:#98a39c;--line:#2b332e;
  --accent:#63c08a;--accent-ink:#0c1a12;--accent-soft:#1f3328;--warn:#f0a36b;--danger:#f2857d;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;max-width:600px;margin:0 auto;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.st-ok .dot{background:var(--accent)}
.st-sync .dot{background:var(--accent);animation:pulse 1s infinite}
.st-error .dot,.st-login .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
main{flex:1;overflow-y:auto;padding:0 12px 24px}
.view[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on b{color:inherit;opacity:.8}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 6px 6px;font-weight:600}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
li{display:flex;align-items:stretch;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.rowmain{flex:1;display:flex;align-items:center;gap:12px;padding:12px 4px 12px 14px;text-align:left;min-height:52px;min-width:0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;color:transparent}
.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:13px}
.done .nm{text-decoration:line-through;color:var(--muted)}
.badge{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--ink)}
.s-Edeka{background:#f7d92b;color:#17357f}.s-Aldi{background:#1257b0;color:#fff}.s-Lidl{background:#0a8a8a;color:#fff}
.s-Netto{background:#d52b1e;color:#fff}.s-DM{background:#6a3fa0;color:#fff}
.more{flex:none;width:48px;font-size:22px;color:var(--muted)}
.add{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:600;margin-right:10px}
.on .add{background:var(--accent);color:var(--accent-ink);font-size:15px}
.on .nm{font-weight:600}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 2px}
.search input,.field input{width:100%;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);outline:none}
.search input:focus,.field input:focus{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty p{margin:0 0 18px}
.btn{display:inline-block;padding:13px 20px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.wide{display:block;width:100%;text-align:center;margin-top:10px}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:10px 6px}
.headrow{display:flex;align-items:center;justify-content:space-between}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:600}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.panel h3{margin:0 0 4px;font-size:20px}
.panel p{color:var(--muted);margin:4px 0 12px;font-size:14px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.banner{margin:4px 4px 10px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.back[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 4px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;min-height:132px;justify-content:center;overflow-wrap:anywhere}
.tile small{font-weight:400;color:var(--muted);font-size:13px}
.tile:active{transform:scale(.97)}
.pic{font-size:52px;line-height:1.1;display:block}
.pic svg{width:56px;height:56px;display:block}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile.on::after{content:'✓';position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.tile.dashed{border-style:dashed;color:var(--muted)}
.tile.shop{min-height:96px;font-size:20px}
.tile.s-Edeka{background:#f7d92b;color:#17357f;border-color:#f7d92b}.tile.s-Aldi{background:#1257b0;color:#fff;border-color:#1257b0}.tile.s-Lidl{background:#0a8a8a;color:#fff;border-color:#0a8a8a}
.tile.s-Netto{background:#d52b1e;color:#fff;border-color:#d52b1e}.tile.s-DM{background:#6a3fa0;color:#fff;border-color:#6a3fa0}
.tile.shop.sel{outline:3px solid var(--accent);outline-offset:2px}
.hero{text-align:center;padding:10px 0 4px}
.hero .pic{font-size:76px}.hero .pic svg{width:84px;height:84px;margin:0 auto}
.hero p{margin:6px 0 0;color:var(--muted)}
.em{flex:none;font-size:24px;width:30px;text-align:center}.em svg{width:26px;height:26px;display:block;margin:auto}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.pic img{width:60px;height:60px;border-radius:14px;object-fit:cover;display:block;margin:0 auto}
.hero .pic img{width:96px;height:96px;border-radius:20px}
.em img{width:30px;height:30px;border-radius:8px;object-fit:cover;display:block}
.imgrow{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.imgrow .pic{width:72px;text-align:center}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emo button{font-size:26px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.emo button.on{border-color:var(--accent);background:var(--accent-soft)}
.arrow{flex:none;width:40px;text-align:center;font-size:22px;color:var(--muted)}
.home{display:grid;gap:12px;padding:10px 4px}
.hcard{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:104px}
.hcard .pic{font-size:46px;flex:none;width:56px;text-align:center}
.hcard b{display:block;font-size:18px}
.hcard small{color:var(--muted);font-size:14px}
.hcard:active{transform:scale(.98)}
.hcard:disabled{opacity:.5}
.hcard.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hcard.main small{color:inherit;opacity:.85}
nav button{min-width:0}

/* ---------- Modernes Erscheinungsbild ---------- */
:root{--bg:#f2f4f1;--surface:#fff;--ink:#132019;--muted:#6a766f;--line:#e6eae6;--accent:#16935a;--accent-soft:#def3e7;
  --grad:linear-gradient(135deg,#25b06c,#0d7d68);--shadow:0 1px 2px rgba(16,28,22,.05),0 10px 28px rgba(16,28,22,.07);--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1210;--surface:#181e1a;--ink:#eaf0ec;--muted:#93a099;--line:#262e29;--accent:#4fd08f;--accent-soft:#16301f;
  --grad:linear-gradient(135deg,#2bb673,#0f8a72);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
body{font-family:"Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:20px 20px 10px;padding-top:calc(20px + env(safe-area-inset-top))}
header h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.status,.back{border:0;box-shadow:var(--shadow)}
main{padding:0 16px 24px}
main.enter>.view:not([hidden]){animation:enter .26s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2{font-size:12px;letter-spacing:.08em;margin:22px 6px 8px}
ul{border:0;box-shadow:var(--shadow);border-radius:20px}
.rowmain{min-height:60px;padding-left:16px}
.chk{width:26px;height:26px;border-color:var(--line);border-width:2.5px;transition:.15s}
.done .chk{background:var(--grad);border-color:transparent;color:#fff}
.badge{border-radius:99px;padding:4px 10px}
.chip{border:0;box-shadow:var(--shadow);padding:9px 16px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.btn{background:var(--grad);color:#fff;border-radius:16px;padding:15px 22px;box-shadow:0 8px 20px rgba(22,147,90,.28)}
.btn.ghost,.btn.danger{background:var(--surface);box-shadow:var(--shadow);border:0}
.btn.ghost{color:var(--ink)}.btn.danger{color:var(--danger)}
.grid{gap:14px;padding:10px 0}
.tile{border:0;box-shadow:var(--shadow);border-radius:24px;padding:18px 10px 16px;gap:10px;min-height:156px;transition:transform .12s}
.tile .pic{width:84px;height:84px;border-radius:26px;background:var(--tint,var(--accent-soft));display:grid;place-items:center;font-size:46px}
.tile .pic img{width:84px;height:84px;border-radius:26px}
@media (prefers-color-scheme:dark){.tile .pic{background:color-mix(in srgb,var(--tint,var(--accent)) 24%,var(--surface))}}
.tile.on{background:var(--surface);box-shadow:0 0 0 2.5px var(--accent),var(--shadow)}
.tile.on::after{background:var(--grad);color:#fff;top:12px;right:12px}
.tile.dashed{box-shadow:none;border:2px dashed var(--line);background:none}
.tile.dashed .pic{background:none;font-size:38px}
.tile.shop{min-height:104px;border-radius:22px;font-size:21px;letter-spacing:-.01em}
.tile.shop.sel{outline:0;box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.hero{padding:6px 0 10px}
.hero .pic{width:132px;height:132px;border-radius:40px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;margin:0 auto;font-size:76px}
.hero p{margin-top:14px;font-size:17px}
.home{gap:14px;padding:6px 0}
.hello{margin:0 4px 6px;color:var(--muted);font-size:16px}
.hcard{border:0;box-shadow:var(--shadow);border-radius:26px;padding:22px 20px;min-height:112px;transition:transform .12s}
.hcard .pic{width:60px;height:60px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;font-size:30px}
.hcard b{font-size:18px;letter-spacing:-.01em;margin-bottom:2px}
.hcard.main{background:var(--grad);color:#fff;min-height:150px;box-shadow:0 14px 34px rgba(22,147,90,.35)}
.hcard.main .pic{background:rgba(255,255,255,.2)}
.hcard.main b{font-size:22px}
.banner{border-radius:18px}
nav{margin:0 14px calc(12px + env(safe-area-inset-bottom));padding:6px;border:0;border-radius:26px;box-shadow:var(--shadow);gap:4px}
nav button{padding:8px 0 7px;border-radius:20px;font-size:12px;gap:3px;transition:.15s}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--accent-soft);color:var(--accent)}
#sheet{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{border-radius:30px 30px 0 0;padding-top:12px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.panel::before{content:'';display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.panel h3{font-size:22px;letter-spacing:-.02em}
.search input,.field input{border-radius:16px;padding:15px 16px}
.emo button{border:0;box-shadow:var(--shadow);border-radius:14px}
.emo button.on{box-shadow:0 0 0 2.5px var(--accent)}
.more{width:38px}
.trash{flex:none;width:48px;display:grid;place-items:center;color:var(--danger)}
.trash svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trash:active{transform:scale(.9)}
.chk{border-color:var(--muted)}
#toast{bottom:calc(104px + env(safe-area-inset-bottom));padding:12px 20px;box-shadow:var(--shadow)}

/* ---------- Dunkles Design (immer aktiv) ---------- */
:root{--bg:#0a0e0c;--surface:#151b17;--ink:#eef3ef;--muted:#8b9891;--line:#262f2a;--accent:#4ade93;--accent-ink:#05130b;--accent-soft:#12301f;
  --warn:#f0a36b;--danger:#ff7b72;--grad:linear-gradient(135deg,#34c97f,#0e8f77);
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 14px 32px rgba(0,0,0,.5);color-scheme:dark}
html{background:var(--bg)}
body{background:radial-gradient(130% 55% at 50% -12%,#143324 0%,rgba(10,14,12,0) 62%) fixed,var(--bg)}
.tile .pic{background:color-mix(in srgb,var(--tint,var(--accent)) 20%,var(--surface))}
.hero .pic{background:var(--surface)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on b{color:inherit}
.btn{box-shadow:0 10px 26px rgba(52,201,127,.25)}
.hcard.main{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 44px rgba(52,201,127,.28)}
nav{background:rgba(21,27,23,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#sheet{background:rgba(0,0,0,.6)}
.panel{background:#101512;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.tile.shop.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #fff}
.tile.dashed{border-color:#34403a}
.addbig{margin-top:18px;padding:20px;font-size:18px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.addbig span{font-size:24px;line-height:1}
.tile.haslogo{background:#fff;color:#111;padding:14px 16px}
.slogo{max-width:100%;max-height:64px;object-fit:contain;display:block}
.badge.logo{background:#fff;padding:3px 7px;display:grid;place-items:center}
.badge.logo img{height:18px;max-width:56px;object-fit:contain;display:block}
.logoprev{background:#fff;border-radius:18px;padding:18px;display:grid;place-items:center;min-height:116px;margin:6px 0}
.logoprev img{max-height:90px;max-width:100%}
.chips[hidden]{display:none}
#storeChips{align-items:center;padding:8px 4px 14px;gap:10px}
.chip.lchip,.chip.lchip.on{background:#fff;color:#111;padding:7px 12px;display:flex;align-items:center;gap:8px;border-radius:16px}
.chip.lchip img{height:30px;max-width:78px;object-fit:contain;display:block}
.chip.lchip b{color:#444;margin:0;opacity:1}
.chip.lchip.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.search{position:static;background:none;padding:2px 0 10px}
.search[hidden]{display:none}
.search input{box-shadow:var(--shadow);border:0;padding-left:18px}
.simlist{margin:10px 0 14px}
.addrow{display:flex;gap:12px;margin-top:18px}
.addrow .addbig{flex:1;margin:0}
.micbtn{flex:none;width:68px;padding:0;display:grid;place-items:center;border-radius:20px}
.micbtn svg,.vmic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vtop{display:flex;align-items:center;gap:14px;margin:10px 0 12px}
.vmic{flex:none;width:72px;height:72px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 26px rgba(52,201,127,.3)}
.vmic.rec{background:#e5484d;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:ring 1.2s infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(229,72,77,0)}}
#vMsg{color:var(--muted);font-size:15px;margin:0}
#vText{width:100%;min-height:76px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;outline:none;resize:vertical}
#vText:focus{border-color:var(--accent)}
#vRes ul{margin-top:14px}
#vRes li.sel .chk{background:var(--grad);border-color:transparent;color:#fff}
#vRes li:not(.sel) .nm{color:var(--muted)}
.vask{display:block!important}
.vq{padding:12px 14px 14px}
.vqt{display:block;font-weight:600;margin-bottom:10px;color:var(--warn)}
.vq .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.vq .chip.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.vq .chip img,.vq .chip svg{width:22px;height:22px;border-radius:6px;display:block}
.vunk{color:var(--warn)!important;margin:12px 4px 0!important}
.btn:disabled{opacity:.45;box-shadow:none}
#listBody li{align-items:center}
#listBody .rowmain{padding:10px 4px 10px 12px;min-height:54px;gap:10px;align-self:stretch}
.qgrp{flex:none;display:flex;align-items:center;gap:1px}
.qb{width:30px;height:30px;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:18px;font-weight:600;line-height:1;display:grid;place-items:center;color:var(--ink)}
.qb:active{transform:scale(.9)}
.qb:disabled{opacity:.35}
.qv{flex:none;min-width:24px;padding:0 5px;text-align:center;font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.done .qv{color:var(--muted);padding-right:8px}
#listBody .badge{margin-left:8px}
#listBody .more{width:30px}
#listBody .nm{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;line-height:1.25}
#listBody .em{width:26px;font-size:22px}
#listBody .chk{width:24px;height:24px}
#listBody .rowmain{padding-left:10px}
#listBody .badge{margin-left:6px}
#listBody .badge.logo{padding:3px 5px}
#listBody .badge.logo img{height:17px;max-width:38px}
#listBody .more{width:26px}
#listBody .trash{width:36px}
#listBody .trash svg{width:20px;height:20px}

function catalog(){
  // Eingebaute Produkte, überlagert von allem, was in der Produktverwaltung angelegt, geändert oder gelöscht wurde.
  const m={};BASE.forEach(p=>m[p.id]={...p,img:''});
  Object.values(S.custom).forEach(c=>{if(c.del)delete m[c.id];else m[c.id]={id:c.id,name:c.name,cat:c.cat,store:c.store||'',img:c.img||''}});
  return Object.values(m);
}
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}
function similar(name){ // gleiche, enthaltene oder fast gleich geschriebene Namen
  const a=norm(name.trim());
  return catalog().filter(p=>{const b=norm(p.name);
    return a===b||(a.length>=3&&b.length>=3&&(a.includes(b)||b.includes(a)))||(Math.min(a.length,b.length)>=5&&lev(a,b)<=2)});
}

function lww(a,b){const o={...a};for(const k in b){if(!o[k]||(b[k].ts||0)>(o[k].ts||0))o[k]=b[k]}return o}
function merge(a,b){
  const m={v:1,items:lww(a.items||{},b.items||{}),prefs:lww(a.prefs||{},b.prefs||{}),custom:lww(a.custom||{},b.custom||{}),stores:lww(a.stores||{},b.stores||{}),order:lww(a.order||{},b.order||{})};
  const old=Date.now()-30*864e5;
  for(const k in m.items)if(m.items[k].del&&m.items[k].ts<old)delete m.items[k];
  return m;
}
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v)}

const GH='https://api.github.com',FILE='einkaufsliste.json';
const HOME=location.origin+location.pathname.replace(/index\.html$/,'');
const b64e=t=>{const b=new TextEncoder().encode(t);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};

  tok=m[1];ls.set(K.tok,tok);etag=sha=null;ls.del(K.etag);ls.del(K.sha);

}
function connect(key){tok=key.trim();if(!tok)return;ls.set(K.tok,tok);etag=sha=null;ls.del(K.etag);ls.del(K.sha);statusMsg='';closeSheet();sync()}

async function sync(){
  if(!CFG.repo){setStatus('local');return}
  if(!tok){setStatus('login');return}
  if(syncing){again=true;return}
  syncing=true;setStatus('sync');
  try{
    const seq=changeSeq,url=`${GH}/repos/${CFG.repo}/contents/${FILE}`;
    const h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    const gh={...h};if(etag&&sha)gh['If-None-Match']=etag; // unverändert -> 304, spart Daten
    const r=await fetch(url,{headers:gh,cache:'no-store'});

        let remote;try{remote=JSON.parse(txt)}catch(e){remote=blank()}

    if(needPut){
      const body={message:'Einkaufsliste aktualisiert',content:b64e(JSON.stringify(S))};if(cur)body.sha=cur;

      if(p.status===409||p.status===422){etag=null;again=true;return} // inzwischen geändert: neu laden

      if(p.status===401)throw new Error('Der Zugangsschlüssel ist ungültig oder abgelaufen. Bitte einen neuen eintragen.');
      if(!p.ok)throw new Error('Speichern fehlgeschlagen ('+p.status+')');
      sha=(await p.json()).content.sha;etag=null;ls.set(K.sha,sha);ls.del(K.etag);
    }

    lastSync=Date.now();ls.set(K.last,lastSync);setStatus('ok');
  }catch(e){setStatus(navigator.onLine?'error':'offline',e.message)}
  finally{syncing=false;if(again){again=false;setTimeout(sync,400)}}
}

  };
  const res=[],unk=[];let qty='',mark=0,fwd='',cur=[];
  const flush=()=>{if(cur.length){unk.push(cur.join(' '));cur=[]}};
  for(let i=0;i<tk.length;){
    const t=tk[i],num=/^\d+$/.test(t)?+t:NUM[t];
    if(SHOP[t]){flush();if(!fwd&&res.length>mark){for(let j=mark;j<res.length;j++)res[j].store=SHOP[t]}else fwd=SHOP[t];mark=res.length;i++;continue}
    const m=find(i);
    if(m){flush();const al=alts(m.w,m.p.id),ex=res.find(r=>!r.opts&&r.p.id===m.p.id);
      if(al.length)res.push({p:m.p,qty,store:fwd||null,opts:[m.p].concat(al),need:true,word:tk.slice(i,i+m.n).join(' ')});
      else if(ex){if(qty)ex.qty=qty}else res.push({p:m.p,qty,store:fwd||null});
      qty='';i+=m.n;continue}
    if(num||EIN.has(t)){const u=tk[i+1];if(u in UNIT){flush();qty=((num||1)+' '+UNIT[u]).trim();i+=2;continue}if(num){flush();qty=String(num);i++;continue}}
    if(FILL.has(t)||EIN.has(t)){flush();i++;continue}
    const al=alts(t,'');
    if(al.length){flush();res.push(al.length===1?{p:al[0],qty,store:fwd||null}:{p:al[0],qty,store:fwd||null,opts:al,need:true,word:t});qty='';i++;continue}
    cur.push(t);i++;
  }
  flush();return {res,unk};
}
function voiceSheet(){
  openSheet(`<h3>Spracheingabe</h3><p>Sag zum Beispiel: „Eier, Bananen und zwei Brote von Aldi“.</p>
  <div class="vtop"><button class="vmic" id="vMic" data-act="vmic" aria-label="Aufnahme starten oder beenden"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><p id="vMsg"></p></div>
  <textarea id="vText" placeholder="Hier erscheint, was verstanden wurde. Du kannst auch tippen oder korrigieren."></textarea>
  <button class="btn ghost wide" data-act="vparse">Text auswerten</button>
  <div id="vRes"></div>
  <button class="btn wide" id="vApply" data-act="vapply" disabled>Auf die Liste setzen</button>
  <button class="btn ghost wide" data-act="close">Abbrechen</button>`,{voice:true,res:[],unk:[],done:false});
  listen();
}
const vmsg=t=>{if($('vMsg'))$('vMsg').textContent=t};
function listen(){
  if(!SR){vmsg('Dieser Browser kann keine Sprache erkennen. Tippe die Produkte unten ein oder nutze das Mikrofon der Tastatur.');return}
  const base=$('vText').value.trim();
  try{
    rec=new SR();rec.lang='de-DE';rec.interimResults=true;rec.continuous=false;
    rec.onstart=()=>{$('vMic')&&$('vMic').classList.add('rec');vmsg('Ich höre zu …')};
    rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript+' ';if($('vText'))$('vText').value=(base?base+', ':'')+t.trim()};
    rec.onerror=e=>vmsg({'not-allowed':'Das Mikrofon ist nicht freigegeben. Die Spracheingabe funktioniert nur über die https-Adresse der App. Du kannst die Produkte unten eintippen.','service-not-allowed':'Die Spracherkennung ist hier nicht verfügbar. Du kannst die Produkte unten eintippen.','no-speech':'Ich habe nichts gehört. Tippe auf das Mikrofon und versuche es noch einmal.','network':'Keine Verbindung zur Spracherkennung. Dafür wird Internet gebraucht.','audio-capture':'Kein Mikrofon gefunden.'}[e.error]||'Die Spracherkennung ist fehlgeschlagen ('+e.error+').');
    rec.onend=()=>{rec=null;if(!$('vMic'))return;$('vMic').classList.remove('rec');if($('vMsg').textContent==='Ich höre zu …')vmsg('Tippe auf das Mikrofon, um weiterzusprechen.');if($('vText').value.trim())voiceParse()};
    rec.start();
  }catch(e){rec=null;vmsg('Die Spracherkennung konnte nicht gestartet werden. Du kannst die Produkte unten eintippen.')}
}
function voiceParse(){
  const x=sheetCtx;if(!x||!x.voice)return;const r=parseSpeech($('vText').value);
  x.res=r.res.map(e=>({...e,on:true}));x.unk=r.unk;x.done=true;drawVoice();
}
function drawVoice(){
  const x=sheetCtx;let h='';
  const ask=(e,i)=>`<li class="vask"><div class="vq"><span class="vqt">„${esc(e.word)}“${e.qty?' ('+esc(e.qty)+')':''} – welches Produkt meinst du?</span><div class="wrap">${e.opts.map((o,k)=>`<button class="chip ${!e.need&&e.on&&e.p.id===o.id?'on':''}" data-act="vpick" data-i="${i}" data-o="${k}">${pic(o.id,o.cat)} ${esc(o.name)}</button>`).join('')}<button class="chip ${!e.need&&!e.on?'on':''}" data-act="vpick" data-i="${i}" data-o="-1">Keins</button></div></div></li>`;
  if(x.res.length)h+=`<ul>${x.res.map((e,i)=>{if(e.opts)return ask(e,i);const st=e.store||e.p.store;return `<li class="${e.on?'sel':''}"><button class="rowmain" data-act="vtog" data-i="${i}"><span class="chk">✓</span><span class="em">${pic(e.p.id,e.p.cat)}</span><span class="nm">${esc(e.p.name)}${e.qty?`<small>${esc(e.qty)}</small>`:''}</span>${badge(st)}</button></li>`}).join('')}</ul>`;
  else if(x.done)h+='<p class="vunk">Ich habe kein Produkt aus dem Katalog erkannt.</p>';
  if(x.unk.length)h+=`<p class="vunk">Nicht im Katalog gefunden: ${esc(x.unk.join(', '))}. Lege es bei Bedarf über „Neues Produkt“ an.</p>`;
  $('vRes').innerHTML=h;
  const need=x.res.some(e=>e.need),n=x.res.filter(e=>e.on&&!e.need).length;$('vApply').disabled=!n||need;$('vApply').textContent=need?'Bitte erst oben auswählen':n?`${n} ${n===1?'Produkt':'Produkte'} auf die Liste setzen`:'Auf die Liste setzen';
}

/* ---------- Bedienung ---------- */
const A={
  tab(d){ui.tab=d.tab;ui.step='cat';ui.qf=ui.qa='';$('qf').value=$('qa').value='';render();enter();document.querySelector('main').scrollTop=0},
  store(d){ui.store=d.s;render()},
  cat(d){ui.cat=d.c;go('prod')},
  back(){goBack()},
  voice(){voiceSheet()},
  vmic(){if(rec){try{rec.stop()}catch(e){}}else listen()},
  vparse(){voiceParse()},
  vpick(d){const e=sheetCtx.res[+d.i],o=+d.o;if(o<0){e.on=false}else{e.p=e.opts[o];e.on=true}e.need=false;drawVoice()},
  vtog(d){const e=sheetCtx.res[+d.i];e.on=!e.on;drawVoice()},
  vapply(){
    const t=Date.now();let n=0;
    sheetCtx.res.filter(e=>e.on&&!e.need).forEach(e=>{const p=e.p,old=S.items[p.id],st=e.store||(onList(p.id)?old.store:p.store)||'';
      S.items[p.id]=onList(p.id)?{...old,store:st,qty:e.qty||old.qty,ts:t}:{id:p.id,name:p.name,cat:p.cat,store:st,qty:e.qty||'',note:'',done:false,del:false,ts:t};n++});
    closeSheet();ui.tab='list';ui.step='cat';ui.store='';touch();toast(n+(n===1?' Produkt':' Produkte')+' auf die Liste gesetzt');
  },
  hnew(){
    const n=Object.values(S.items).filter(i=>!i.del).length;
    if(!n){A.tab({tab:'prod'});return}
    openSheet(`<h3>Es gibt noch eine aktuelle Liste</h3><p>Sie enthält ${n} ${n===1?'Produkt':'Produkte'}. Möchtest du sie weiterführen oder mit einer leeren Liste neu beginnen?</p>
    <button class="btn wide" data-act="hcont">Aktuelle Liste weiterführen</button>
    <button class="btn danger wide" data-act="hfresh">Neue Liste beginnen (alte leeren)</button>
    <button class="btn ghost wide" data-act="close">Abbrechen</button>`);
  },
  hcont(){closeSheet();A.tab({tab:'list'})},
  hfresh(){const t=Date.now();Object.values(S.items).forEach(i=>{if(!i.del){i.del=true;i.ts=t}});closeSheet();touch();A.tab({tab:'prod'})},
  prodpick(d){ui.pid=d.id;const p=catalog().find(x=>x.id===d.id);if(p&&CAT[p.cat])ui.cat=p.cat;go('store')},
  newq(){prodSheet(null,CATS[0][0],true,ui.qf.trim())},
  toggle(d){const i=S.items[d.id];if(i){i.done=!i.done;i.ts=Date.now();touch()}},
  edit(d){editSheet(d.id)},
  qplus(d){qstep(d.id,1)},
  qminus(d){qstep(d.id,-1)},
  trash(d){const i=S.items[d.id];if(i){i.del=true;i.ts=Date.now();touch();toast(i.name+' entfernt')}},
  storepick(d){
    const p=catalog().find(x=>x.id===ui.pid);if(!p)return;const t=Date.now(),old=S.items[p.id];
    S.items[p.id]=onList(p.id)?{...old,store:d.s,ts:t}:{id:p.id,name:p.name,cat:p.cat,store:d.s,qty:'',note:'',done:false,del:false,ts:t};
    ui.tab='list';ui.step='cat';ui.store='';ui.qf='';$('qf').value='';
    try{touch()}finally{render();enter();document.querySelector('main').scrollTop=0}
    toast(p.name+(d.s?' ('+d.s+')':'')+' steht auf der Liste');
  },
  unpick(){const i=S.items[ui.pid];if(i){i.del=true;i.ts=Date.now();touch();toast(i.name+' entfernt')}goBack()},
  clear(){const t=Date.now();Object.values(S.items).forEach(i=>{if(i.done&&!i.del){i.del=true;i.ts=t}});touch()},
  new(){prodSheet(null,ui.cat,true)},
  sedit(d){storeSheet(d.s)},
  wup(d){wmove(d.k,-1)},
  wdown(d){wmove(d.k,1)},
  snologo(){const x=sheetCtx.shop;S.stores[x]={img:'',ts:Date.now()};touch();storeSheet(x)},
  padd(){prodSheet(null,CATS[0][0],false,(ui.qa||'').trim())},
  pforce(){sheetCtx.confirmed=true;A.psave()},
  pbackedit(){drawProd()},
  pedit(d){prodSheet(d.id)},
  pcat(d){keep();sheetCtx.cat=d.c;drawProd()},
  pstore(d){keep();sheetCtx.store=d.s;drawProd()},
  pemoji(d){keep();sheetCtx.img=d.e;drawProd()},
  pnoimg(){keep();sheetCtx.img='';drawProd()},
  pphoto(){$('fImg').click()},
  psave(){
    keep();const x=sheetCtx,n=x.name.trim(),t0=Date.now();if(!n){$('fName').focus();return}
    let id=x.pid;
    if(!id){
      const sim=x.confirmed?[]:similar(n);
      if(sim.length){ // Warnung: ähnliche Produkte gibt es schon
        x.name=n;
        openSheet(`<h3>Ähnliches Produkt vorhanden</h3><p>Im Katalog gibt es bereits ${sim.length===1?'ein ähnliches Produkt':sim.length+' ähnliche Produkte'}. Möchtest du „${esc(n)}“ wirklich neu anlegen?</p>
        <ul class="simlist">${sim.slice(0,6).map(p=>`<li><span class="rowmain"><span class="em">${pic(p.id,p.cat)}</span><span class="nm">${esc(p.name)}<small>${esc(CAT[p.cat]?CAT[p.cat].name:'Sonstiges')}</small></span>${badge(p.store)}</span></li>`).join('')}</ul>
        <button class="btn wide" data-act="pforce">Trotzdem neu anlegen</button>
        <button class="btn ghost wide" data-act="pbackedit">Zurück zur Eingabe</button>
        <button class="btn ghost wide" data-act="close">Abbrechen</button>`,x);
        return;
      }
      id='c:'+n.toLowerCase();
      if(catalog().some(q=>q.id===id||q.id==='p:'+n.toLowerCase()||norm(q.name)===norm(n)))id+='~'+t0.toString(36);
    }
    const t=Date.now();S.custom[id]={id,name:n,cat:x.cat,store:x.store,img:x.img,del:false,ts:t};
    const it=S.items[id];if(it&&!it.del){it.name=n;it.cat=x.cat;it.ts=t}
    const add=x.thenAdd;closeSheet();touch();
    if(add){ui.pid=id;go('store')}else toast(n+' gespeichert');
  },
  pdel(){const x=sheetCtx;S.custom[x.pid]={id:x.pid,name:x.name,cat:x.cat,store:x.store,img:'',del:true,ts:Date.now()};closeSheet();touch();toast(x.name+' gelöscht')},
  setstore(d){commitFields();const i=S.items[sheetCtx.id];i.store=d.s;i.ts=Date.now();touch();editSheet(i.id)},
  save(){commitFields();closeSheet()},
  remove(){const i=S.items[sheetCtx.id];i.del=true;i.ts=Date.now();closeSheet();touch()},
  close(){closeSheet()},
  settings(){settingsSheet()},
  connect(){connect($('fKey').value)},
  async sharekey(){
    const link=HOME+'#k='+tok;
    try{if(navigator.share){await navigator.share({title:'Einkaufsliste einrichten',url:link});return}}catch(e){return}
    try{await navigator.clipboard.writeText(link);toast('Link kopiert – nur an deine Frau schicken')}catch(e){openSheet(`<h3>Einrichtungs-Link</h3><p>Diesen Link auf dem zweiten Handy öffnen. Er enthält den Zugangsschlüssel, also nicht weitergeben.</p><div class="field"><input readonly value="${esc(link)}" onfocus="this.select()"></div><button class="btn ghost wide" data-act="close">Schließen</button>`)}
  },
  logout(){logout()},
  syncnow(){closeSheet();sync()}
};
document.addEventListener('click',e=>{
  if(e.target===$('sheet')){commitFields();closeSheet();return}
  const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset);
});
$('fImg').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!sheetCtx)return;
  const im=new Image();
  im.onload=()=>{
    if(sheetCtx.shop){ // Logo: Seitenverhältnis behalten, nur verkleinern
      const w=im.width||280,hh=im.height||160,k=Math.min(1,280/w,160/hh),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);const x=sheetCtx.shop;S.stores[x]={img:c.toDataURL('image/png'),ts:Date.now()};
      URL.revokeObjectURL(im.src);touch();storeSheet(x);return;
    }
    // Foto quadratisch zuschneiden und klein rechnen, damit die gespeicherte Datei schlank bleibt
    const c=document.createElement('canvas'),z=160,m=Math.min(im.width,im.height);c.width=c.height=z;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);
    keep();sheetCtx.img=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(im.src);drawProd();
  };
  im.src=URL.createObjectURL(f);
});
$('qf').addEventListener('input',e=>{ui.qf=e.target.value;renderFlow(null)});
$('qa').addEventListener('input',e=>{ui.qa=e.target.value;renderAdmin()});
addEventListener('popstate',()=>{if(!$('sheet').hidden){closeSheet();return}goBack()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
addEventListener('online',sync);
setInterval(()=>{if(!document.hidden&&navigator.onLine&&$('sheet').hidden)sync()},20000);

(async()=>{
  render();
  if(CFG.repo)takeKeyFromLink();
  setStatus(!CFG.repo?'local':(tok?'ok':'login'));
  sync();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
